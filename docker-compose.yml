# Local single-broker Apache Kafka for development (KRaft mode, no ZooKeeper).
#
#   docker compose up -d kafka        start (waits for nothing; check `docker compose ps`)
#   docker compose down               stop and delete the container (topic data is lost)
#
# Listeners:
#   PLAINTEXT_HOST  127.0.0.1:9092  -> for programs on your machine (the Python producer)
#                   127.0.0.1 rather than "localhost": on Windows, localhost resolves to IPv6 ::1
#                   first and each refused ::1 attempt costs ~2 s (measured), which made the
#                   producer's metadata check time out intermittently.
#   PLAINTEXT       kafka:19092     -> for other containers on this compose network
#   CONTROLLER      kafka:9093      -> KRaft controller, internal only
#
# The host port is bound to 127.0.0.1, so the broker is NOT reachable from other machines.
# No authentication or TLS: local development only.
#
# Topic data lives inside the container: it survives `docker compose stop/start` but is
# deleted by `docker compose down`. Automatic topic creation is disabled on purpose; create
# the topic with `uv run python -m data_engineering.streaming.topic_setup`.
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: dco-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Optional PostgreSQL for the telemetry store (SQLite is the default and needs nothing).
  # Started only on request:  docker compose --profile postgres up -d --wait postgres
  # There is deliberately no default password: set POSTGRES_PASSWORD in .env (compose reads it)
  # or the environment; without it the image refuses to start. Bound to 127.0.0.1:55432
  # (55432 avoids clashing with a locally installed PostgreSQL on 5432). Data persists in a
  # named volume until `docker compose --profile postgres down -v`.
  postgres:
    image: postgres:16-alpine
    container_name: dco-postgres
    profiles: ["postgres"]
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dco}
      POSTGRES_USER: ${POSTGRES_USER:-dco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - dco-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dco-postgres-data:
