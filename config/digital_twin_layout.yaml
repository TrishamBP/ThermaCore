# DEMONSTRATION LAYOUT for the 3D digital twin (hackathon). NOT a verified physical facility.
# The telemetry has no room/aisle/rack topology: rack membership, coordinates and dimensions below
# are illustrative. Server objects map to the simulator's asset ids (SIM-NA-001..020).
# Units: metres; position = object centre in room coordinates (x east, y up, z north).
# Override the file with DIGITAL_TWIN_LAYOUT=<path>.

layout:
  revision: demo-1
  demonstration: true
  units: m

# Colour/status bands for overlays: visual thresholds only, NOT equipment safety limits.
overlay_bands:
  temperature: [{max: 21.0, status: cool}, {max: 24.0, status: normal}, {max: 26.0, status: warm}, {max: null, status: hot}]
  workload: [{max: 0.3, status: low}, {max: 0.7, status: medium}, {max: null, status: high}]
  airflow: [{max: 150.0, status: low}, {max: 220.0, status: medium}, {max: null, status: high}]
  energy: [{max: 100.0, status: low}, {max: 200.0, status: medium}, {max: null, status: high}]

